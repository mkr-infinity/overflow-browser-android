name: Manual APK build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK variant to build
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: read

concurrency:
  group: manual-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: overflow-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: overflow-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Print APK checksums
        if: success()
        run: |
          find app/build/outputs/apk -name '*.apk' -type f -print0 | xargs -0 -r sha256sum

      - name: Note about release signing
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: |
          echo "Release APKs are unsigned. Sign them with apksigner before installing." >> "$GITHUB_STEP_SUMMARY"
